<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 262" width="384" height="262">
  <defs>
    <linearGradient id="lt-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E1E2E4"/><stop offset=".55" stop-color="#D0D2D5"/><stop offset="1" stop-color="#BFC2C6"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="384" height="262" rx="16" fill="url(#lt-body)"/>
  <rect x="0" y="0" width="384" height="12" rx="6" fill="#A7AAAF"/>
  <rect x="3" y="15" width="378" height="244" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="1.5"/>
  <!-- soccer ball -->
  <g transform="translate(84 86) rotate(-10)">
    <defs><clipPath id="lt-ball"><circle r="30"/></clipPath></defs>
    <circle r="32" fill="#FFFFFF"/>
    <g clip-path="url(#lt-ball)" fill="#16150F">
      <polygon points="0,-11 10.5,-3.4 6.5,8.9 -6.5,8.9 -10.5,-3.4"/>
      <polygon points="0,-38 11,-30 7,-18 -7,-18 -11,-30"/>
      <polygon points="0,-38 11,-30 7,-18 -7,-18 -11,-30" transform="rotate(72)"/>
      <polygon points="0,-38 11,-30 7,-18 -7,-18 -11,-30" transform="rotate(144)"/>
      <polygon points="0,-38 11,-30 7,-18 -7,-18 -11,-30" transform="rotate(216)"/>
      <polygon points="0,-38 11,-30 7,-18 -7,-18 -11,-30" transform="rotate(288)"/>
    </g>
    <g stroke="#16150F" stroke-width="2" clip-path="url(#lt-ball)">
      <line x1="0" y1="-11" x2="0" y2="-18"/><line x1="0" y1="-11" x2="0" y2="-18" transform="rotate(72)"/><line x1="0" y1="-11" x2="0" y2="-18" transform="rotate(144)"/><line x1="0" y1="-11" x2="0" y2="-18" transform="rotate(216)"/><line x1="0" y1="-11" x2="0" y2="-18" transform="rotate(288)"/>
    </g>
    <circle r="30" fill="none" stroke="#16150F" stroke-width="2.5"/>
  </g>
  <!-- basketball -->
  <g transform="translate(306 76) rotate(14)">
    <circle r="32" fill="#FFFFFF"/>
    <circle r="29" fill="#E07B39" stroke="#16150F" stroke-width="2.5"/>
    <g fill="none" stroke="#16150F" stroke-width="2.2">
      <line x1="-29" y1="0" x2="29" y2="0"/><line x1="0" y1="-29" x2="0" y2="29"/>
      <path d="M-20 -21 C -8 -8, -8 8, -20 21"/><path d="M20 -21 C 8 -8, 8 8, 20 21"/>
    </g>
  </g>
  <!-- a small neural network -->
  <g transform="translate(198 82) rotate(-3)">
    <rect x="-46" y="-34" width="92" height="68" rx="12" fill="#FFFFFF"/>
    <g stroke="#16150F" stroke-width="1.4" opacity=".55">
      <path d="M-28 -16 L0 -22 M-28 -16 L0 0 M-28 -16 L0 22 M-28 16 L0 -22 M-28 16 L0 0 M-28 16 L0 22 M0 -22 L28 0 M0 0 L28 0 M0 22 L28 0"/>
    </g>
    <g fill="#16150F"><circle cx="-28" cy="-16" r="5"/><circle cx="-28" cy="16" r="5"/><circle cx="0" cy="-22" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="0" cy="22" r="5"/></g>
    <circle cx="28" cy="0" r="6" fill="#FFE36E" stroke="#16150F" stroke-width="2"/>
  </g>
  <!-- the line that trains the model -->
  <g transform="translate(112 196) rotate(-5)">
    <rect x="-68" y="-21" width="136" height="42" rx="9" fill="#16150F" stroke="#FFFFFF" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="16" fill="#FFFFFF">model.<tspan fill="#FFE36E">fit</tspan>()</text>
  </g>
  <!-- an AI sparkle -->
  <g transform="translate(250 196) rotate(8)">
    <circle r="27" fill="#16150F" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M0 -17 C 2 -5, 5 -2, 17 0 C 5 2, 2 5, 0 17 C -2 5, -5 2, -17 0 C -5 -2, -2 -5, 0 -17 Z" fill="#FFE36E"/>
    <path d="M12 -15 C 12.6 -12, 13.5 -11.4, 16 -11 C 13.5 -10.6, 12.6 -10, 12 -7 C 11.4 -10, 10.5 -10.6, 8 -11 C 10.5 -11.4, 11.4 -12, 12 -15 Z" fill="#FFFFFF"/>
  </g>
</svg>
