<head>

<title>Page not found — Grishma Gajurel</title>

<script>
  (function () {
    var p = location.pathname.replace(/\/$/, "").split("/").pop();
    var map = { about: "#experience", projects: "#work", project: "#work", contact: "#contact" };
    if (map[p]) location.replace("/" + map[p]);
  })();
</script>
<style>
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0E100D; color: #E7E9E2; font-family: "Geist", system-ui, sans-serif; }
  main { padding: 2rem; max-width: 34rem; }
  .code { font-family: "Geist Mono", ui-monospace, monospace; font-size: .8rem; color: #8C9286; }
  h1 { margin: 1rem 0 .8rem; font-weight: 300; font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1; letter-spacing: -.04em; }
  p { margin: 0 0 1.6rem; color: #8C9286; }
  a { font-family: "Geist Mono", ui-monospace, monospace; font-size: .85rem; color: #B7C79A; text-decoration: none; border-bottom: 1px solid #2A2E27; }
</style>
</head>
