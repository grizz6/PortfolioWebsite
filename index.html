<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grishma Gajurel — Data Analyst &amp; Software Engineer</title>
<meta name="description" content="Grishma Gajurel, data analyst, software engineer and photographer. Retrieval with citations, synthetic test data, exploratory analysis, ecology research." />
<meta name="author" content="Grishma Gajurel" />
<meta name="theme-color" content="#F7F4EF" />
<link rel="canonical" href="https://www.grishmagajurel.com/" />
<meta property="og:title" content="Grishma Gajurel — Data Analyst &amp; Software Engineer" />
<meta property="og:description" content="Data analyst, software engineer and photographer. Retrieval with citations, synthetic test data, exploratory analysis, ecology research." />
<meta property="og:url" content="https://www.grishmagajurel.com/" />
<meta property="og:type" content="website" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Editorial and quiet: warm off-white paper, near-black ink, one wine-rose accent with amber and slate as
     supporting colours. Instrument Serif for headings, Inter for reading, Geist Mono for small labels. */
  :root {
    --bg: #F7F4EF; --card: #FFFFFF; --ink: #18161B; --muted: #67626C; --line: #E7E1DA;
    --accent: #A63A5E; --accent-soft: #F4E4E9; --amber: #C9853F; --amber-soft: #F7EADB; --slate: #4F5DA8; --slate-soft: #E6E9F5;
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --pad: clamp(1.25rem, 5vw, 4rem); --col: 72rem; --r: 18px;
    --shadow: 0 1px 2px rgba(24, 22, 27, .04), 0 8px 24px -12px rgba(24, 22, 27, .12);
    --shadow-up: 0 2px 4px rgba(24, 22, 27, .05), 0 22px 44px -18px rgba(24, 22, 27, .22);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.65 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); font-size: .78rem; letter-spacing: .02em; color: var(--muted); }
  .wrap { max-width: var(--col); margin: 0 auto; padding-inline: var(--pad); }

  header { position: sticky; top: 0; z-index: 40; transition: background .3s, box-shadow .3s; }
  header.scrolled { background: rgba(247, 244, 239, .82); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); box-shadow: 0 1px 0 var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; height: 4rem; gap: 1rem; }
  header .name { font-family: var(--serif); font-size: 1.35rem; letter-spacing: 0; color: var(--ink); }
  header nav { display: flex; gap: clamp(1rem, 3vw, 2.2rem); }
  header nav a { position: relative; color: var(--muted); transition: color .2s; }
  header nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: var(--accent); transform: scaleX(0); transition: transform .3s; }
  header nav a:hover, header nav a.on { color: var(--ink); } header nav a.on::after { transform: scaleX(1); }
  .progress { position: fixed; left: 0; top: 0; z-index: 41; height: 2px; width: 100%; background: linear-gradient(90deg, var(--accent), var(--amber)); transform-origin: left; transform: scaleX(0); }

  /* Intro: a soft glow of the three colours behind a large serif name */
  .hero { position: relative; isolation: isolate; }
  .hero::before { content: ""; position: absolute; inset: -4rem 0 0; z-index: -1; pointer-events: none;
    background: radial-gradient(38rem 26rem at 78% 30%, rgba(166, 58, 94, .16), transparent 70%),
                radial-gradient(30rem 22rem at 92% 70%, rgba(201, 133, 63, .14), transparent 70%),
                radial-gradient(34rem 24rem at 58% 82%, rgba(79, 93, 168, .10), transparent 70%); }
  .hero .wrap { min-height: calc(100svh - 4rem); display: grid; align-content: center; padding-block: 3rem 6rem; }
  .eyebrow { display: inline-flex; align-items: center; gap: .6rem; justify-self: start; }
  .eyebrow::before { content: ""; width: 2rem; height: 1px; background: var(--accent); }
  .hero h1 { margin: 1.4rem 0 1.4rem; font-family: var(--serif); font-weight: 400; font-size: clamp(3.6rem, 11vw, 9rem); line-height: .92; letter-spacing: -.02em; }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero p { margin: 0; max-width: 30rem; font-size: clamp(1.05rem, 1.6vw, 1.22rem); color: var(--muted); }
  .hero .cta { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2.4rem; }
  .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .78rem 1.35rem; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 500 .92rem/1 var(--sans); cursor: pointer; box-shadow: var(--shadow); transition: transform .25s, box-shadow .25s, background .25s; }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: #fff; } .btn.solid:hover { background: var(--accent); border-color: var(--accent); }

  section { position: relative; padding-block: clamp(4rem, 9vw, 7rem); }
  .head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 2.4rem; }
  h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 6vw, 4.2rem); line-height: 1; letter-spacing: -.01em; }
  h2 em { font-style: italic; color: var(--accent); }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s cubic-bezier(.2, .7, .2, 1), transform .7s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i, 0) * 90ms); }
  .reveal.in { opacity: 1; transform: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

  /* Experience */
  .cv { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; }
  .cv li { padding: 1.7rem 1.8rem; min-width: 0; }
  .cv .top { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .cv .org { color: var(--accent); }
  .cv h3 { margin: 1rem 0 .2rem; font-family: var(--serif); font-weight: 400; font-size: 1.8rem; line-height: 1.1; }
  .cv p { margin: .6rem 0 0; color: var(--muted); }
  .skills { display: flex; flex-wrap: wrap; gap: .5rem; margin: 2rem 0 0; padding: 0; list-style: none; }
  .skills li { padding: .35rem .85rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .6); font-size: .86rem; color: var(--ink); }

  /* Projects */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; }
  .exp { display: flex; flex-direction: column; min-width: 0; overflow: hidden; transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s; }
  .exp:hover { transform: translateY(-4px); box-shadow: var(--shadow-up); }
  .exp canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #FFFFFF; border-bottom: 1px solid var(--line); }
  .exp .body { display: flex; flex-direction: column; gap: .8rem; padding: 1.4rem 1.6rem 1.6rem; flex: 1; }
  .exp .meta { display: flex; justify-content: space-between; gap: 1rem; }
  .exp h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 2rem; line-height: 1.05; }
  .exp p { margin: 0; color: var(--muted); font-size: .96rem; }
  .facts { display: flex; flex-wrap: wrap; gap: .45rem; }
  .facts span { padding: .22rem .65rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 500; }
  .facts span:nth-child(2) { background: var(--amber-soft); color: #8A5420; } .facts span:nth-child(3) { background: var(--slate-soft); color: var(--slate); }
  .exp .tags { display: flex; flex-wrap: wrap; gap: .2rem 1rem; }
  .exp .links { display: flex; flex-wrap: wrap; gap: .4rem 1.3rem; margin-top: auto; padding-top: .6rem; }
  .exp .links a { font-weight: 500; font-size: .92rem; color: var(--ink); border-bottom: 1px solid var(--line); transition: color .2s, border-color .2s; }
  .exp .links a:hover { color: var(--accent); border-color: var(--accent); }
  .loadmore { display: flex; justify-content: center; margin-top: 2.4rem; }
  .latest { margin-top: 3rem; padding: 1.5rem 1.8rem; }
  .latest ul { list-style: none; margin: 1rem 0 0; padding: 0; border-top: 1px solid var(--line); }
  .latest a { display: grid; grid-template-columns: 6rem 1fr auto; gap: .2rem 1.4rem; align-items: baseline; padding: .85rem 0; border-bottom: 1px solid var(--line); transition: color .2s; }
  .latest li:last-child a { border-bottom: 0; }
  .latest a:hover { color: var(--accent); }
  .latest p { grid-column: 2; margin: 0; color: var(--muted); font-size: .9rem; }
  .more { display: inline-block; margin-top: 1.4rem; } .more:hover { color: var(--accent); }

  /* Prints: a few photographs scattered beside the intro, like prints on a table */
  .hero .wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); column-gap: 3rem; }
  .hero .wrap > * { grid-column: 1; }
  .prints { grid-column: 2 !important; grid-row: 1 / span 5; align-self: center; position: relative; height: min(34rem, 70svh); perspective: 900px; }
  .print { position: absolute; width: 58%; padding: .55rem .55rem 1.9rem; background: #fff; border: 0; border-radius: 4px; cursor: zoom-in; box-shadow: 0 2px 6px rgba(24, 22, 27, .08), 0 18px 40px -14px rgba(24, 22, 27, .32);
    left: var(--x); top: var(--y); transform: translate3d(var(--px, 0), var(--py, 0), 0) rotate(var(--r)); transition: transform .5s cubic-bezier(.2, .7, .2, 1), box-shadow .3s; }
  .print img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 2px; }
  .print span { position: absolute; left: .7rem; right: .7rem; bottom: .45rem; text-align: left; font-family: var(--mono); font-size: .66rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .print:hover, .print:focus-visible { z-index: 5; transform: translate3d(var(--px, 0), calc(var(--py, 0px) - 10px), 0) rotate(0deg) scale(1.04); box-shadow: 0 4px 10px rgba(24, 22, 27, .1), 0 34px 60px -20px rgba(24, 22, 27, .45); }

  /* Photographs: filters by place, a masonry grid that keeps each frame's shape, prints that develop on arrival */
  .ph-intro { margin: -1.2rem 0 1.8rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.8rem; }
  .chip { padding: .42rem .95rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .6); font: 500 .86rem/1 var(--sans); color: var(--ink); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
  .chip b { margin-left: .35rem; font: 400 .74rem var(--mono); color: var(--muted); }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; } .chip[aria-pressed="true"] b { color: #BDB7C2; }
  .masonry { columns: 3 16rem; column-gap: 1.1rem; }
  .ph { position: relative; display: block; width: 100%; margin: 0 0 1.1rem; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: #E9E3DC; cursor: zoom-in; break-inside: avoid; box-shadow: var(--shadow);
    transform: perspective(800px) rotateX(var(--ty, 0deg)) rotateY(var(--tx, 0deg)); transition: transform .4s cubic-bezier(.2, .7, .2, 1), box-shadow .4s; }
  .ph:hover { box-shadow: var(--shadow-up); }
  .ph img { display: block; width: 100%; height: auto; filter: grayscale(1) contrast(.9) brightness(.82); transform: scale(1.04); transition: filter 1.6s ease, transform 1.2s cubic-bezier(.2, .7, .2, 1); }
  .ph.dev img { filter: none; transform: none; }
  .ph:hover img { transform: scale(1.05); }
  .ph .cap { position: absolute; inset: auto 0 0; display: grid; gap: .15rem; padding: 2.4rem 1rem .9rem; text-align: left; color: #fff; background: linear-gradient(transparent, rgba(12, 10, 14, .72)); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
  .ph:hover .cap, .ph:focus-visible .cap { opacity: 1; transform: none; }
  .ph .cap strong { font: 400 1.35rem/1.1 var(--serif); }
  .ph .cap small { font: .7rem/1.4 var(--mono); color: #E4DEE8; letter-spacing: .02em; }
  .ph.gone { display: none; }

  /* Viewer */
  dialog.lightbox { width: 100vw; height: 100svh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(14, 12, 16, .96); color: #fff; }
  dialog.lightbox::backdrop { background: rgba(14, 12, 16, .6); }
  dialog.lightbox[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: lbIn .3s ease; }
  @keyframes lbIn { from { opacity: 0; } }
  .lb-top, .lb-bottom { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem clamp(1rem, 3vw, 2rem); }
  .lb-top .mono, .lb-bottom .mono { color: #BDB7C2; }
  .lb-stage { position: relative; display: grid; place-items: center; min-height: 0; height: 100%; overflow: hidden; padding: 0 clamp(3.4rem, 7vw, 6rem); touch-action: pan-y; }
  .lb-stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; min-height: 0; object-fit: contain; border-radius: 6px; box-shadow: 0 30px 80px -30px #000; transition: opacity .25s, transform .25s; }
  .lb-stage img.swap { opacity: 0; transform: scale(.985); }
  .lb-nav { position: absolute; top: 50%; translate: 0 -50%; width: 2.9rem; height: 2.9rem; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .06); color: #fff; font-size: 1.2rem; cursor: pointer; transition: background .2s; }
  .lb-nav:hover { background: rgba(255, 255, 255, .16); } .lb-prev { left: clamp(.5rem, 2vw, 1.5rem); } .lb-next { right: clamp(.5rem, 2vw, 1.5rem); }
  .lb-close { padding: .45rem .9rem; border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; background: none; color: #fff; font: .78rem var(--mono); cursor: pointer; }
  .lb-close:hover { background: rgba(255, 255, 255, .1); }
  .lb-bottom h3 { margin: 0; font: 400 clamp(1.4rem, 3vw, 2rem)/1.1 var(--serif); }
  .hud { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: flex-end; }
  .hud span { padding: .2rem .55rem; border: 1px solid rgba(255, 255, 255, .18); border-radius: 6px; font: .72rem var(--mono); color: #E4DEE8; }

  /* Contact: a dark panel with the same soft glow as the intro */
  .contact .card { position: relative; overflow: hidden; isolation: isolate; padding: clamp(2rem, 5vw, 4rem); background: var(--ink); border-color: var(--ink); color: #F7F4EF; }
  .contact .card::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(30rem 20rem at 90% 0%, rgba(166, 58, 94, .45), transparent 70%), radial-gradient(26rem 18rem at 100% 100%, rgba(201, 133, 63, .28), transparent 70%); }
  .contact h2 em { color: #E7A3B9; }
  .contact .big { display: inline-block; margin-top: 1.4rem; font-family: var(--serif); font-size: clamp(1.8rem, 5vw, 3.8rem); line-height: 1.1; overflow-wrap: anywhere; border-bottom: 1px solid rgba(247, 244, 239, .35); transition: border-color .2s; }
  .contact .big:hover { border-color: #F7F4EF; }
  .contact .links { display: flex; flex-wrap: wrap; gap: .8rem 1.4rem; margin-top: 2rem; align-items: center; }
  .contact .links a { color: #D9D3DD; } .contact .links a:hover { color: #fff; }
  .contact .btn { background: #F7F4EF; border-color: #F7F4EF; box-shadow: none; }
  footer { padding-block: 2rem; }
  footer .wrap { display: flex; justify-content: space-between; gap: .6rem 1.2rem; flex-wrap: wrap; }
  footer a:hover { color: var(--accent); }

  @media (max-width: 820px) {
    header nav { display: none; }
    .cv, .grid { grid-template-columns: 1fr; }
    .hero .wrap { align-content: start; padding-top: 4rem; min-height: auto; padding-bottom: 3rem; }
    .hero::before { background: radial-gradient(24rem 18rem at 85% 20%, rgba(166, 58, 94, .16), transparent 70%), radial-gradient(20rem 16rem at 100% 70%, rgba(201, 133, 63, .14), transparent 70%); }
    .latest a { grid-template-columns: 1fr auto; } .latest a .mono:first-child { grid-column: 1 / -1; } .latest p { grid-column: 1 / -1; }
    .hero .wrap { grid-template-columns: 1fr; }
    .prints { grid-column: 1 !important; grid-row: auto; height: 17rem; margin-top: 2.6rem; }
    .print { width: 42%; }
    .masonry { columns: 2; column-gap: .7rem; } .ph { margin-bottom: .7rem; border-radius: 10px; }
    .ph .cap { opacity: 1; transform: none; padding: 1.6rem .7rem .6rem; } .ph .cap strong { font-size: 1.05rem; } .ph .cap small { display: none; }
    .lb-stage { padding: 0 .6rem; } .lb-nav { display: none; } .lb-bottom { flex-direction: column; align-items: flex-start; } .hud { justify-content: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; } .reveal { opacity: 1; transform: none; transition: none; }
    .btn, .exp, .print, .ph, .ph img, .lb-stage img { transition: none; } .ph img { filter: none; transform: none; }
    dialog.lightbox[open] { animation: none; }
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<header><div class="wrap"><a href="#top" class="name" data-name></a><nav class="mono" aria-label="Sections"><a href="#experience">Experience</a><a href="#work">Projects</a><a href="#photos" data-photos-link hidden>Photographs</a><a href="#contact">Contact</a></nav></div></header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <span class="eyebrow mono" data-title></span>
      <h1>Grishma <em>Gajurel</em></h1>
      <p data-headline></p>
      <div class="cta"><a class="btn solid" href="#work">See projects ↓</a><a class="btn" data-github target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
      <div class="prints" data-prints hidden></div>
    </div>
  </div>

  <section id="experience" aria-labelledby="e-h"><div class="wrap">
    <div class="head"><h2 id="e-h">Experience</h2></div>
    <ul class="cv" data-cv></ul>
    <ul class="skills" data-skills></ul>
  </div></section>

  <section id="work" aria-labelledby="w-h"><div class="wrap">
    <div class="head"><h2 id="w-h">Projects</h2><span class="mono" data-count></span></div>
    <div class="grid" data-projects></div>
    <div class="loadmore"><button type="button" class="btn" data-loadmore>Load more</button></div>
    <div class="latest card" data-latest hidden>
      <div class="head" style="margin:0"><span class="mono" style="color:var(--ink)">Latest on GitHub</span><span class="mono" data-synced></span></div>
      <ul data-repos></ul>
    </div>
    <a class="more mono" data-github target="_blank" rel="noopener noreferrer">All repositories on GitHub ↗</a>
  </div></section>

  <section id="photos" aria-labelledby="p-h" hidden><div class="wrap">
    <div class="head"><h2 id="p-h">Photographs</h2><span class="mono" data-photo-count></span></div>
    <p class="ph-intro mono" data-photo-intro></p>
    <div class="chips" role="group" aria-label="Filter by place" data-chips></div>
    <div class="masonry" data-gallery></div>
  </div></section>

  <section id="contact" class="contact" aria-labelledby="c-h"><div class="wrap"><div class="card">
    <h2 id="c-h">Contact</h2>
    <a class="big" data-email></a>
    <div class="links mono"><button type="button" class="btn" data-copy>Copy email</button><span data-social></span></div>
  </div></div></section>
</main>

<dialog class="lightbox" aria-label="Photograph viewer">
  <div class="lb-top"><span class="mono" data-lb-count></span><button type="button" class="lb-close" data-close>Close ✕</button></div>
  <div class="lb-stage"><button type="button" class="lb-nav lb-prev" data-prev aria-label="Previous photograph">←</button><img alt="" /><button type="button" class="lb-nav lb-next" data-next aria-label="Next photograph">→</button></div>
  <div class="lb-bottom"><div><h3 data-lb-title></h3><span class="mono" data-lb-where></span></div><div class="hud" data-lb-hud></div></div>
</dialog>

<footer><div class="wrap mono"><span>© <span data-year></span> <span data-name></span></span><a href="#top">Back to top ↑</a></div></footer>

<script src="js/content.js?v=90"></script>
<script src="js/site.js?v=90"></script>
</body>
</html>
