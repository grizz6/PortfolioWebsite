<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grishma Gajurel — Data Analyst &amp; Software Engineer</title>
<meta name="description" content="Grishma Gajurel, data analyst and software engineer. Research, machine learning, reporting, and tested data tools like synthkit." />
<meta name="author" content="Grishma Gajurel" />
<meta name="theme-color" content="#0E100D" />
<link rel="canonical" href="https://www.grishmagajurel.com/" />
<meta property="og:title" content="Grishma Gajurel — Data Analyst &amp; Software Engineer" />
<meta property="og:description" content="Data analyst and software engineer. Research, machine learning, reporting, and tested data tools like synthkit." />
<meta property="og:url" content="https://www.grishmagajurel.com/" />
<meta property="og:type" content="website" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* One column on a quiet grid. Mono for labels and data, sans for everything people read. */
  :root {
    --bg: #0E100D; --surface: #151813; --fg: #E7E9E2; --muted: #8C9286; --faint: #2A2E27; --line: #23271F; --accent: #B7C79A;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --pad: clamp(1.25rem, 5vw, 4rem); --col: 64rem;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 4rem 4rem; mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%); opacity: .55; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  .mono { font-family: var(--mono); font-size: .78rem; letter-spacing: .04em; color: var(--muted); }
  .wrap { max-width: var(--col); margin: 0 auto; padding-inline: var(--pad); }

  header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; height: 3.5rem; }
  header nav { display: flex; gap: clamp(1rem, 3vw, 2rem); }
  header a:hover { color: var(--fg); }

  .intro { position: relative; isolation: isolate; min-height: min(78svh, 46rem); display: grid; align-content: end; padding-block: 6rem 4rem; }
  .intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .intro h1 { margin: 1.2rem 0 1.4rem; font-weight: 300; font-size: clamp(2.8rem, 8vw, 6.2rem); line-height: .95; letter-spacing: -.045em; }
  .intro p { margin: 0; max-width: 34rem; font-size: clamp(1.05rem, 1.8vw, 1.3rem); color: var(--muted); text-wrap: balance; }
  .status { display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; margin-top: 2.4rem; }
  .status span::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: .6rem; border-radius: 50%; background: var(--accent); vertical-align: .1em; box-shadow: 0 0 0 0 var(--accent); animation: ping 2.4s ease-out infinite; }
  .status span + span::before { animation: none; background: var(--muted); }
  .status a { color: var(--fg); border-bottom: 1px solid var(--faint); } .status a:hover { border-color: var(--accent); }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(183,199,154,.5); } 80%, 100% { box-shadow: 0 0 0 7px rgba(183,199,154,0); } }

  section { padding-block: clamp(3.5rem, 9vw, 6rem); border-top: 1px solid var(--line); }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 1.8rem; }
  h2 { margin: 0; font-weight: 400; font-size: 1.05rem; letter-spacing: -.01em; }
  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 7rem 1fr auto; gap: .3rem 2rem; align-items: baseline; padding-block: 1.05rem; border-bottom: 1px solid var(--line); }
  .row h3 { margin: 0; font-weight: 400; font-size: 1.05rem; }
  .row p { grid-column: 2; margin: 0; max-width: 40rem; color: var(--muted); font-size: .95rem; }
  .row .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
  a.row { transition: background 250ms; } a.row:hover { background: var(--surface); }
  a.row .go { color: var(--muted); transition: color 250ms, translate 250ms; } a.row:hover .go { color: var(--accent); translate: 3px -3px; }
  .head.sub { margin: 3rem 0 1.2rem; }
  .more { display: inline-block; margin-top: 1.4rem; color: var(--muted); } .more:hover { color: var(--accent); }
  .skills { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
  .skills li { padding: .3rem .75rem; border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-size: .78rem; color: var(--fg); }

  .contact a.big { display: inline-block; font-weight: 300; font-size: clamp(1.6rem, 5vw, 3rem); letter-spacing: -.03em; border-bottom: 1px solid var(--faint); transition: border-color 250ms; overflow-wrap: anywhere; }
  .contact a.big:hover { border-color: var(--accent); }
  .contact .links { display: flex; flex-wrap: wrap; gap: .6rem 1.6rem; margin-top: 1.6rem; align-items: center; }
  .contact button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .contact .links > *:hover { color: var(--fg); }
  footer { padding-block: 2.5rem; border-top: 1px solid var(--line); }
  footer .wrap { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr auto; }
    .row .mono:first-child { grid-column: 1 / -1; }
    .row p, .row .tags { grid-column: 1 / -1; }
    header nav a:nth-child(2) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .status span::before { animation: none; } }
</style>
</head>
<body>
<header><div class="wrap"><a href="#top" data-name></a><nav class="mono"><a href="#work">Work</a><a href="#experience">Experience</a><a href="#contact">Contact</a></nav></div></header>

<main id="top">
  <div class="intro wrap">
    <canvas aria-hidden="true"></canvas>
    <span class="mono" data-title></span>
    <h1 data-name></h1>
    <p data-headline></p>
    <div class="status mono" data-status></div>
  </div>

  <section id="work" aria-labelledby="w-h"><div class="wrap">
    <div class="head"><h2 id="w-h">Selected work</h2><span class="mono" data-count></span></div>
    <ul class="list" data-projects></ul>
    <div data-latest hidden>
      <div class="head sub"><h2>Latest on GitHub</h2><span class="mono" data-synced></span></div>
      <ul class="list" data-repos></ul>
    </div>
    <a class="more mono" data-github target="_blank" rel="noopener noreferrer">All repositories on GitHub ↗</a>
  </div></section>

  <section id="experience" aria-labelledby="e-h"><div class="wrap">
    <div class="head"><h2 id="e-h">Experience</h2></div>
    <ul class="list" data-experience></ul>
    <div class="head" style="margin-top:3rem"><h2>Education</h2></div>
    <ul class="list" data-education></ul>
  </div></section>

  <section aria-labelledby="s-h"><div class="wrap">
    <div class="head"><h2 id="s-h">Tools</h2></div>
    <ul class="skills" data-skills></ul>
  </div></section>

  <section id="contact" class="contact" aria-labelledby="c-h"><div class="wrap">
    <div class="head"><h2 id="c-h">Contact</h2></div>
    <a class="big" data-email></a>
    <div class="links mono"><button type="button" data-copy>Copy email</button><span data-social></span></div>
  </div></section>
</main>

<footer><div class="wrap mono"><span>© <span data-year></span> <span data-name></span></span><a href="#top">Back to top ↑</a></div></footer>

<script src="js/content.js?v=21"></script>
<script src="js/site.js?v=21"></script>
</body>
</html>
